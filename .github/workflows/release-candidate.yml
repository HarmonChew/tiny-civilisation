name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - name: Full release check and package
        if: matrix.node == '24'
        run: npm run check:release
      - name: Full release check on minimum Node
        if: matrix.node == '22.12.0'
        run: node scripts/run-release-check.mjs --skip-package
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: tiny-civilisation-web-release-candidate
          path: |
            release/*.zip
            release/*.sha256
            release/*.json
          if-no-files-found: error
